<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Taxonomy</title>
  <style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --border: #dddcd6;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #77766f;
  --accent: #2a78d6;
  --accent-text: #ffffff;
  --warn-bg: #fff4d6;
  /* Coverage sunburst: share of foods eaten, in six steps */
  --seq-0: #b7d3f6; --seq-text-0: #0b0b0b;
  --seq-1: #86b6ef; --seq-text-1: #0b0b0b;
  --seq-2: #5598e7; --seq-text-2: #0b0b0b;
  --seq-3: #2a78d6; --seq-text-3: #ffffff;
  --seq-4: #1c5cab; --seq-text-4: #ffffff;
  --seq-5: #104281; --seq-text-5: #ffffff;
  --warn-border: #eda100;
  --error-bg: #fde8e7;
  --error-border: #e34948;
  --ok-bg: #e3f5ec;
  --ok-border: #1baf7a;
  --mark: #fff0a8;
  /* Kingdom colors: categorical slots 1-3, fixed per kingdom */
  --k-metazoa: #2a78d6;
  --k-fungi: #eb6834;
  --k-viridiplantae: #1baf7a;
  --k-other: #8a8983;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #3a3a37;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #9a998f;
    --accent: #3987e5;
    --warn-bg: #3a2f10;
    /* Coverage sunburst: share of foods eaten, in six steps */
    --seq-0: #104281; --seq-text-0: #ffffff;
    --seq-1: #1c5cab; --seq-text-1: #ffffff;
    --seq-2: #2a78d6; --seq-text-2: #ffffff;
    --seq-3: #5598e7; --seq-text-3: #0b0b0b;
    --seq-4: #86b6ef; --seq-text-4: #0b0b0b;
    --seq-5: #b7d3f6; --seq-text-5: #0b0b0b;
    --error-bg: #3d1b1b;
    --ok-bg: #133227;
    --mark: #5c4e12;
    --k-metazoa: #3987e5;
    --k-fungi: #d95926;
    --k-viridiplantae: #199e70;
    --k-other: #8a8983;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --border: #3a3a37;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #9a998f;
  --accent: #3987e5;
  --warn-bg: #3a2f10;
  /* Coverage sunburst: share of foods eaten, in six steps */
  --seq-0: #104281; --seq-text-0: #ffffff;
  --seq-1: #1c5cab; --seq-text-1: #ffffff;
  --seq-2: #2a78d6; --seq-text-2: #ffffff;
  --seq-3: #5598e7; --seq-text-3: #0b0b0b;
  --seq-4: #86b6ef; --seq-text-4: #0b0b0b;
  --seq-5: #b7d3f6; --seq-text-5: #0b0b0b;
  --error-bg: #3d1b1b;
  --ok-bg: #133227;
  --mark: #5c4e12;
  --k-metazoa: #3987e5;
  --k-fungi: #d95926;
  --k-viridiplantae: #199e70;
  --k-other: #8a8983;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface-0);
  color: var(--text-primary);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1 { margin: 0; font-size: 1.5rem; }
h2 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
.subtitle { margin: .1rem 0 1rem; color: var(--text-secondary); }
.muted { color: var(--text-muted); }

.top { padding: 1.25rem 16px 0; max-width: 1100px; margin: 0 auto; }
main { padding: 0 16px 3rem; max-width: 1100px; margin: 0 auto; }

.tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button {
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: .6rem .9rem; font: inherit; color: var(--text-secondary); cursor: pointer; white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }

.panel { padding-top: 1rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center; margin-bottom: .5rem; }
.toolbar input[type="search"] { flex: 1 1 220px; }

input, select {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 6px; padding: .45rem .6rem;
}
button {
  font: inherit; cursor: pointer; border-radius: 6px; padding: .45rem .9rem;
  background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent);
}
button.secondary { background: var(--surface-1); color: var(--text-primary); border-color: var(--border); }
button:disabled { opacity: .6; cursor: progress; }
label.check { display: inline-flex; gap: .35rem; align-items: center; color: var(--text-secondary); }
a { color: var(--accent); }

.banner { border-left: 4px solid; border-radius: 6px; padding: .6rem .9rem; margin: 1rem 0 0; }
.banner.warn { background: var(--warn-bg); border-color: var(--warn-border); }
.banner.error { background: var(--error-bg); border-color: var(--error-border); }
.banner.ok { background: var(--ok-bg); border-color: var(--ok-border); }
.banner ul { margin: .25rem 0 0; padding-left: 1.2rem; }

/* Tree */
.tree { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: .5rem .75rem; overflow-x: auto; }
.tree ul { list-style: none; margin: 0; padding-left: 1.1rem; border-left: 1px solid var(--border); }
.tree > ul { padding-left: 0; border-left: none; }
.tree li { margin: 0; padding-left: .35rem; }
.tree .kdot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; background: var(--kingdom); margin: 0 .4rem 0 .1rem; }
.tree summary { cursor: pointer; padding: .1rem 0; white-space: nowrap; }
.tree .leaf { padding: .1rem 0 .1rem .35rem; white-space: nowrap; }
.tree .leaf::before { content: "•"; color: var(--kingdom, var(--text-muted)); margin-right: .45rem; }
.tree .name { font-weight: 600; }
.tree .sci { font-style: italic; }
.tree.full ul { padding-left: .75rem; }
.tree .meaning { color: var(--text-secondary); margin-left: .35rem; }
.tree .rank, .tree .count, .tree .food { color: var(--text-muted); font-size: .85em; margin-left: .45rem; }
.tree .rank { text-transform: uppercase; letter-spacing: .04em; font-size: .72em; }
.tree .food { color: var(--text-secondary); }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.tree .remove {
  margin-left: .6rem; padding: 0 .45rem; font-size: .78em; line-height: 1.5;
  background: none; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px;
}
.tree .remove:hover, .tree .remove:focus-visible { color: var(--error-border); border-color: var(--error-border); }
.banner button { margin-left: .5rem; padding: .15rem .6rem; }

/* Cladogram */
.figure { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: .5rem; overflow-x: auto; }
.figure img { display: block; width: 100%; min-width: 900px; height: auto; }
/* The full cladogram is far wider than the page: show it at its own size and scroll */
.figure.natural img { width: auto; min-width: 0; max-width: none; }

/* Stats */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: .8rem 1rem; }
.tile .value { font-size: 2rem; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .label { color: var(--text-secondary); }
.columns { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 2.2fr); gap: 0 2rem; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; width: 100%; }
th, td { padding: .4rem .75rem; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--text-secondary); font-weight: 600; font-size: .9em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
.dot { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; background: var(--kingdom); margin-right: .45rem; vertical-align: -.05rem; }

/* Forms and results */
.form { display: grid; gap: .8rem; max-width: 520px; }
.form label { display: grid; gap: .25rem; }
.form label.check { display: inline-flex; }
.form.inline { display: flex; flex-wrap: wrap; align-items: end; max-width: none; gap: .8rem 1rem; }
.form button { justify-self: start; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-top: 1rem; }
.card pre { background: var(--surface-0); border-radius: 6px; padding: .6rem .8rem; overflow-x: auto; font-size: .85rem; max-height: 22rem; }
.card .actions { display: flex; gap: .5rem; margin-top: .75rem; }
.gap-lists { display: grid; grid-template-columns: 1fr 2fr; gap: 0 2rem; }
.gap-lists ul { padding-left: 1.1rem; margin: .25rem 0; }
.gap-lists.cols ul { columns: 2 220px; }

@media (max-width: 700px) {
  .columns, .gap-lists { grid-template-columns: 1fr; }
  .tree ul { padding-left: .6rem; }
  .tree .count { display: none; }
}

/* Add buttons in Gaps and suggestions */
.add-inline { margin-left: .45rem; padding: 0 .5rem; font-size: .78em; line-height: 1.6; border-radius: 4px; }
.added { margin-left: .45rem; color: var(--ok-border); font-size: .85em; }
.add-error { margin-left: .45rem; color: var(--error-border); font-size: .85em; }
.suggestions li { margin-bottom: .55rem; }
.chips { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; margin-top: .2rem; }
.chip { font-size: .8em; padding: .05rem .5rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-0); }
#suggest-result .card, #gaps-result .card { margin-bottom: 1rem; }

/* Relatives */
.columns.two { grid-template-columns: 1fr 1fr; }
.lineage { padding-left: 1.4rem; margin: .25rem 0; }
.lineage li { margin: .15rem 0; }
#relatives-result .rank, #relatives-result + * .rank, .card .rank {
  color: var(--text-muted); font-size: .72em; text-transform: uppercase; letter-spacing: .04em; margin-left: .45rem;
}

/* Coverage sunburst */
.sunburst-wrap { position: relative; max-width: 640px; }
#sunburst svg { width: 100%; height: auto; display: block; }
.seg { stroke: var(--surface-0); stroke-width: 2; cursor: default; }
.seg:hover { stroke: var(--text-primary); stroke-width: 1.5; }
.seg.step-0, .swatch.step-0 { fill: var(--seq-0); background: var(--seq-0); }
.seg-label.step-0 { fill: var(--seq-text-0); }
.seg.step-1, .swatch.step-1 { fill: var(--seq-1); background: var(--seq-1); }
.seg-label.step-1 { fill: var(--seq-text-1); }
.seg.step-2, .swatch.step-2 { fill: var(--seq-2); background: var(--seq-2); }
.seg-label.step-2 { fill: var(--seq-text-2); }
.seg.step-3, .swatch.step-3 { fill: var(--seq-3); background: var(--seq-3); }
.seg-label.step-3 { fill: var(--seq-text-3); }
.seg.step-4, .swatch.step-4 { fill: var(--seq-4); background: var(--seq-4); }
.seg-label.step-4 { fill: var(--seq-text-4); }
.seg.step-5, .swatch.step-5 { fill: var(--seq-5); background: var(--seq-5); }
.seg-label.step-5 { fill: var(--seq-text-5); }
.seg-label { font-size: 10px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.sun-center { fill: var(--text-primary); font-size: 18px; font-weight: 650; }
.sun-center tspan + tspan { font-size: 12px; font-weight: 400; fill: var(--text-secondary); }
.legend { display: flex; flex-wrap: wrap; gap: .3rem .8rem; align-items: center; margin: .5rem 0; font-size: .85em; }
.legend-item { display: inline-flex; align-items: center; gap: .3rem; color: var(--text-secondary); }
.swatch { display: inline-block; width: .9rem; height: .9rem; border-radius: 3px; }
.tooltip {
  position: absolute; z-index: 5; pointer-events: none; max-width: 210px; font-size: .85em;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: .4rem .6rem;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
}

/* The static copy (export_site.py) has no server: hide everything that changes files */
.static [data-tab="add"], .static [data-tab="gaps"], .static .remove, .static .add-inline { display: none; }

</style>
</head>
<body>
  <header class="top">
    <h1>Food Taxonomy</h1>
    <p class="subtitle">Everything I remember eating, on the tree of life</p>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="tree">Tree</button>
      <button role="tab" data-tab="cladogram">Cladogram</button>
      <button role="tab" data-tab="stats">Stats</button>
      <button role="tab" data-tab="relatives">Relatives</button>
      <button role="tab" data-tab="add">Add organism</button>
      <button role="tab" data-tab="gaps">Gaps</button>
    </nav>
  </header>

  <main>
    <div id="warnings" class="banner warn" hidden></div>

    <section id="tab-tree" class="panel" role="tabpanel">
      <div class="toolbar">
        <input id="tree-search" type="search" placeholder="Search taxa or foods" aria-label="Search taxa or foods">
        <label class="check"><input id="tree-major" type="checkbox" checked> Major ranks only</label>
        <button id="tree-expand" class="secondary">Expand all</button>
        <button id="tree-collapse" class="secondary">Collapse all</button>
      </div>
      <div id="tree-status"></div>
      <p id="tree-summary" class="muted"></p>
      <div id="tree" class="tree"></div>
    </section>

    <section id="tab-cladogram" class="panel" role="tabpanel" hidden>
      <div class="toolbar">
        <label class="check"><input id="clado-major" type="checkbox" checked> Major ranks only</label>
        <a id="clado-open" target="_blank" rel="noopener">Open full size</a>
      </div>
      <p id="clado-status" class="muted">Drawing…</p>
      <div class="figure"><img id="clado-img" alt="Cladogram of every organism in the tree"></div>
    </section>

    <section id="tab-stats" class="panel" role="tabpanel" hidden>
      <div id="stats-tiles" class="tiles"></div>
      <div class="columns">
        <div>
          <h2>Distinct taxa</h2>
          <table id="stats-ranks"></table>
        </div>
        <div>
          <h2>By kingdom</h2>
          <div class="scroll"><table id="stats-kingdoms"></table></div>
        </div>
      </div>
      <h2>Coverage</h2>
      <div class="sunburst-wrap">
        <div id="sunburst"></div>
        <div id="sunburst-tip" class="tooltip" hidden></div>
      </div>
    </section>

    <section id="tab-relatives" class="panel" role="tabpanel" hidden>
      <form id="relatives-form" class="form inline">
        <label>Food or organism
          <input id="rel-a" list="rel-options" placeholder="e.g. shiitake">
        </label>
        <label>Compare with
          <input id="rel-b" list="rel-options" placeholder="optional, e.g. human">
        </label>
        <datalist id="rel-options"></datalist>
        <button type="submit">Show relatives</button>
      </form>
      <div id="relatives-result"></div>
    </section>

    <section id="tab-add" class="panel" role="tabpanel" hidden>
      <form id="add-form" class="form">
        <label>Scientific or common name
          <input id="add-name" required placeholder="e.g. Salmo salar or honey bee">
        </label>
        <label>File name <span class="muted">(optional; defaults to the common name)</span>
          <input id="add-file" placeholder="e.g. salmon">
        </label>
        <label class="check"><input id="add-force" type="checkbox"> Overwrite or allow duplicates</label>
        <button type="submit">Look up on NCBI</button>
      </form>
      <div id="add-result"></div>
    </section>

    <section id="tab-gaps" class="panel" role="tabpanel" hidden>
      <form id="gaps-form" class="form inline">
        <label>Taxon
          <input id="gaps-taxon" list="gaps-taxa" required placeholder="e.g. Mammalia">
          <datalist id="gaps-taxa"></datalist>
        </label>
        <label>Rank
          <select id="gaps-rank">
            <option value="">Next rank down</option>
            <option value="kingdom">Kingdom</option>
            <option value="phylum">Phylum</option>
            <option value="class">Class</option>
            <option value="order">Order</option>
            <option value="family">Family</option>
            <option value="genus">Genus</option>
            <option value="species">Species and varieties</option>
          </select>
        </label>
        <label class="check"><input id="gaps-all" type="checkbox"> Include groups with no common foods</label>
        <label class="check"><input id="gaps-refresh" type="checkbox"> Refresh from NCBI</label>
        <button type="submit">Find gaps</button>
        <button type="button" id="suggest-button" class="secondary">Suggest foods to try</button>
      </form>
      <div id="suggest-result"></div>
      <div id="gaps-result"></div>
    </section>
  </main>

    else if (key === "style") node.setAttribute("style", value);
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

async function api(path, body) {
  // The static copy made by export_site.py has its data built in and no server
  if (window.STATIC_DATA) {
    const data = window.STATIC_DATA[path.split("?")[0]];
    if (!data) throw new Error("not available in this static copy of the site");
    return data;
  }
  const options = { headers: {} };
  if (body !== undefined) {
    options.method = "POST";
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}

function banner(kind, ...content) {
  return el("div", { class: `banner ${kind}`, role: kind === "error" ? "alert" : "status" }, ...content);
}

function kingdomVar(name) {
  return `var(${KINGDOM_COLORS[name] || "--k-other"})`;
}

function foodName(filename) {
  return filename.replace(/\.txt$/, "").replace(/_/g, " ");
}

function plural(n, one, many) {
  return `${n} ${n === 1 ? one : many}`;
}

// Text with every case-insensitive match of query wrapped in <mark>
function highlight(text, query) {
  if (!query) return [text];
  const parts = [];
  const lower = text.toLowerCase();
  let start = 0;
  for (let i = lower.indexOf(query); i !== -1; i = lower.indexOf(query, start)) {
    parts.push(text.slice(start, i), el("mark", {}, text.slice(i, i + query.length)));
    start = i + query.length;
  }
  parts.push(text.slice(start));
  return parts;
}

// ---------- tree ----------

// Organisms below each node, and which kingdom it belongs to
function annotate(node, kingdom) {
  if (node.code === "K") kingdom = node.name;
  node.kingdom = kingdom;
  node.leaves = node.eaten || node.children.length === 0 ? 1 : 0;
  for (const child of node.children) node.leaves += annotate(child, kingdom);
  return node.leaves;
}

// The tree with unranked clades removed (leaves stay, even if unranked)
function majorOnly(node) {
  const children = [];
  const collect = (parent) => {
    for (const child of parent.children) {
      if (child.code || child.children.length === 0 || child.eaten) children.push(majorOnly(child));
      else collect(child);
    }
  };
  collect(node);
  return { ...node, children };
}

// Does the node or anything below it match the search?
function matches(node, query, files) {
  if (!query) return true;
  return selfMatches(node, query, files) || node.children.some((child) => matches(child, query, files));
}

// Matches the scientific name, its meaning ("four-legged") or a food name
function selfMatches(node, query, files) {
  const own = [node.name, node.meaning || "", ...(files[node.name] || []).map(foodName)];
  return own.some((text) => text.toLowerCase().includes(query));
}

// The food names and Remove buttons for an eaten node (one per taxonomy file)
function foodParts(node, query, files) {
  const nodeFiles = files[node.name] || [];
  const foods = nodeFiles.map(foodName).join(", ");
  return [
    foods ? el("span", { class: "food" }, highlight(foods, query)) : null,
    nodeFiles.map((filename) => el("button", {
      type: "button", class: "remove",
      title: `Remove ${filename}`, "aria-label": `Remove ${foodName(filename)} (${node.name})`,
      onclick: (event) => { event.preventDefault(); removeFile(filename, node.name); },
    }, nodeFiles.length > 1 ? `Remove ${foodName(filename)}` : "Remove")),
  ];
}

function renderNode(node, query, files, showAll) {
  const style = node.kingdom ? `--kingdom: ${kingdomVar(node.kingdom)}` : null;
  if (node.children.length === 0) {
    return el("li", { class: "leaf", style },
      el("span", { class: "sci" }, highlight(node.name, query)),
      foodParts(node, query, files));
  }
  const showChildren = showAll || (query && selfMatches(node, query, files));
  const children = node.children.filter((child) => showChildren || matches(child, query, files));
  const rankName = node.code ? treeData.rankNames[node.code] : null;
  return el("li", { style },
    el("details", { open: true },
      el("summary", {},
        node.code === "K" ? el("span", { class: "kdot", "aria-hidden": "true" }) : null,
        el("span", { class: node.code ? "name" : "" }, highlight(node.name, query)),
        node.meaning ? el("span", { class: "meaning" }, "(", highlight(node.meaning, query), ")") : null,
        rankName ? el("span", { class: "rank" }, rankName) : null,
        // A species eaten itself, with a variety or subspecies below it (onion above shallot)
        node.eaten ? foodParts(node, query, files) : null,
        el("span", { class: "count" }, plural(node.leaves, "organism", "organisms"))),
      el("ul", {}, children.map((child) => renderNode(child, query, files, showChildren)))));
}

function renderTree() {
  if (!treeData) return;
  const query = document.getElementById("tree-search").value.trim().toLowerCase();
  const major = document.getElementById("tree-major").checked;
  const root = major ? majorOnly(treeData.tree) : treeData.tree;
  annotate(root, null);
  const container = document.getElementById("tree");
  // Every clade gets a row, so the full tree is much deeper; it uses a narrower indent
  container.classList.toggle("full", !major);
  if (query && !matches(root, query, treeData.files)) {
    container.replaceChildren(el("p", { class: "muted" }, `Nothing matches “${query}”.`));
    return;
  }
  container.replaceChildren(el("ul", {}, renderNode(root, query, treeData.files, !query)));
}

async function loadTree() {
  try {
    treeData = await api("/api/tree");
  } catch (error) {
    document.getElementById("tree").replaceChildren(banner("error", `Couldn't load the tree: ${error.message}`));
    return;
  }
  annotate(treeData.tree, null);
  const kingdoms = new Set();
  const walk = (node) => { if (node.code === "K") kingdoms.add(node.name); node.children.forEach(walk); };
  walk(treeData.tree);
  document.getElementById("tree-summary").textContent =
    `${plural(treeData.tree.leaves, "organism", "organisms")} across ${plural(kingdoms.size, "kingdom", "kingdoms")}. ` +
    "Dot colors mark each kingdom.";

  const warnings = document.getElementById("warnings");
  warnings.hidden = treeData.warnings.length === 0;
  warnings.replaceChildren("Possible mistakes in the taxonomy files:",
    el("ul", {}, treeData.warnings.map((warning) => el("li", {}, warning))));

  // Ranked names (kingdom to order) as suggestions for the gaps form
  const options = [];
  const collect = (node) => {
    if ("KPCOFG".includes(node.code) && node.code) options.push(node.name);
    node.children.forEach(collect);
  };
  collect(treeData.tree);
  document.getElementById("gaps-taxa").replaceChildren(...options.sort().map((name) => el("option", { value: name })));
  renderTree();
  fillRelativesOptions();
}

    document.getElementById("stats-tiles").replaceChildren(banner("error", `Couldn't load stats: ${error.message}`));

  const totals = stats.totals;
  const tiles = [["Organisms", totals.organisms || 0], ["Species", totals.species || 0]];
  if (totals.subspecies) tiles.push(["Subspecies", totals.subspecies]);

// ---------- relatives ----------

// Every organism as {name, foods, path: [nodes from the root]}
function organisms() {
  const found = [];
  const walk = (node, path) => {
    const here = [...path, node];
    if (node.eaten || node.children.length === 0) {
      found.push({ name: node.name, foods: (treeData.files[node.name] || []).map(foodName), path: here });
    }
    node.children.forEach((child) => walk(child, here));
  };
  walk(treeData.tree, []);
  return found;
}

function organismLabel(organism) {
  return organism.foods.length ? `${organism.foods.join(", ")} (${organism.name})` : organism.name;
}

function findOrganism(text) {
  const query = text.trim().toLowerCase();
  if (!query) return null;
  const all = organisms();
  return all.find((o) => organismLabel(o).toLowerCase() === query)
    || all.find((o) => o.foods.some((f) => f.toLowerCase() === query) || o.name.toLowerCase() === query)
    || all.find((o) => organismLabel(o).toLowerCase().includes(query));
}

// The deepest node two organisms share, and the index of it in their paths
function sharedAncestor(a, b) {
  let i = 0;
  while (i < a.path.length && i < b.path.length && a.path[i] === b.path[i]) i++;
  return i - 1;
}

function cladeLabel(node) {
  // Organisms without a formal rank (subspecies, varieties) get no rank tag
  const rank = node.code ? treeData.rankNames[node.code].toLowerCase() : node.eaten ? "" : "clade";
  return [el("strong", {}, node.name), node.meaning ? ` (${node.meaning})` : "", rank ? el("span", { class: "rank" }, rank) : null];
}

function renderRelatives() {
  const output = document.getElementById("relatives-result");
  if (!treeData) return;
  const a = findOrganism(document.getElementById("rel-a").value);
  const b = findOrganism(document.getElementById("rel-b").value);
  const typed = document.getElementById("rel-a").value.trim();
  if (!a) {
    output.replaceChildren(el("p", { class: "muted" }, typed
      ? `Nothing in your tree matches “${typed}”. Pick a food or organism from the suggestions.`
      : "Pick a food or organism from your tree."));
    return;
  }
  const parts = [];
  if (b && b.name !== a.name) {
    const at = sharedAncestor(a, b);
    const ancestor = a.path[at];
    parts.push(el("div", { class: "card" },
      el("h2", { style: "margin-top:0" }, `${organismLabel(a)} and ${organismLabel(b)}`),
      el("p", {}, "Closest shared ancestor: ", cladeLabel(ancestor)),
      el("div", { class: "columns two" },
        [a, b].map((o) => el("div", {}, el("h3", {}, `From there to ${o.foods[0] || o.name}`),
          el("ol", { class: "lineage" }, o.path.slice(at + 1).map((node) => el("li", {}, cladeLabel(node)))))))));
  }
  // The organisms that share the deepest ancestor with a
  const others = organisms().filter((o) => o.name !== a.name);
  const best = Math.max(...others.map((o) => sharedAncestor(a, o)));
  const closest = others.filter((o) => sharedAncestor(a, o) === best);
  parts.push(el("div", { class: "card" },
    el("h2", { style: "margin-top:0" }, `Closest relatives of ${organismLabel(a)} in your tree`),
    el("p", {}, "They share: ", cladeLabel(a.path[best])),
    el("ul", {}, closest.map((o) => el("li", {}, organismLabel(o))))));
  output.replaceChildren(...parts);
  const params = new URLSearchParams({ a: document.getElementById("rel-a").value, b: document.getElementById("rel-b").value });
  history.replaceState(null, "", `${location.search}#relatives?${params}`);
}

function fillRelativesOptions() {
  const options = organisms().map((o) => el("option", { value: organismLabel(o) }));
  document.getElementById("rel-options").replaceChildren(...options);
  const params = new URLSearchParams(location.hash.split("?")[1] || "");
  if (params.get("a")) document.getElementById("rel-a").value = params.get("a");
  if (params.get("b")) document.getElementById("rel-b").value = params.get("b");
  renderRelatives();
}

  event.preventDefault();

// ---------- coverage sunburst ----------

const COVERAGE_STEPS = 6;
const RING_NAMES = ["Kingdom", "Phylum", "Class", "Order"];

function coverageStep(group) {
  // 0..5: share of the group's foods eaten, in six bins
  return Math.min(COVERAGE_STEPS - 1, Math.floor((group.eaten / group.total) * COVERAGE_STEPS));
}

function arcPath(r0, r1, a0, a1) {
  const point = (r, a) => `${(r * Math.sin(a)).toFixed(2)},${(-r * Math.cos(a)).toFixed(2)}`;
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return `M${point(r1, a0)}A${r1},${r1} 0 ${large} 1 ${point(r1, a1)}L${point(r0, a1)}A${r0},${r0} 0 ${large} 0 ${point(r0, a0)}Z`;
}

function renderSunburst(top) {
  const svgNS = "http://www.w3.org/2000/svg";
  const size = 520, center = 70, ring = (size / 2 - center) / RING_NAMES.length;
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", `${-size / 2} ${-size / 2} ${size} ${size}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `Sunburst of ${top.total} common and eaten foods by kingdom, phylum, class and order, shaded by share eaten`);
  const tooltip = document.getElementById("sunburst-tip");
  const show = (event, group, path) => {
    tooltip.hidden = false;
    tooltip.replaceChildren(el("strong", {}, group.name), el("span", { class: "muted" }, ` ${group.rank}`),
      el("div", {}, `${group.eaten} of ${group.total} eaten (${Math.round((100 * group.eaten) / group.total)}%)`),
      path.length > 1 ? el("div", { class: "muted" }, path.slice(0, -1).join(" › ")) : null);
    const box = svg.parentElement.getBoundingClientRect();
    tooltip.style.left = `${Math.min(event.clientX - box.left + 14, box.width - 220)}px`;
    tooltip.style.top = `${event.clientY - box.top + 14}px`;
  };
  const draw = (group, depth, a0, a1, path) => {
    if (depth > 0) {
      const shape = document.createElementNS(svgNS, "path");
      shape.setAttribute("d", arcPath(center + (depth - 1) * ring, center + depth * ring, a0, a1));
      shape.setAttribute("class", `seg step-${coverageStep(group)}`);
      shape.addEventListener("mousemove", (event) => show(event, group, path));
      shape.addEventListener("mouseleave", () => { tooltip.hidden = true; });
      svg.append(shape);
      // Label segments with room for the name
      const middle = (a0 + a1) / 2, radius = center + (depth - 0.5) * ring;
      if ((a1 - a0) * radius > group.name.length * 6.2 && ring > 20) {
        const label = document.createElementNS(svgNS, "text");
        // Text runs along the ring, flipped on the lower half so it's never upside down
        let rotate = (middle * 180) / Math.PI;
        if (rotate > 90 && rotate < 270) rotate += 180;
        label.setAttribute("transform", `translate(${(radius * Math.sin(middle)).toFixed(1)},${(-radius * Math.cos(middle)).toFixed(1)}) rotate(${rotate.toFixed(1)})`);
        label.setAttribute("class", `seg-label step-${coverageStep(group)}`);
        label.textContent = group.name;
        svg.append(label);
      }
    }
    if (depth < RING_NAMES.length) {
      // Groups with nothing eaten aren't included, so the shown children share the
      // whole parent slice
      const shown = group.children.reduce((sum, child) => sum + child.total, 0);
      let start = a0;
      for (const child of group.children) {
        const end = start + ((a1 - a0) * child.total) / shown;
        draw(child, depth + 1, start, end, [...path, child.name]);
        start = end;
      }
    }
  };
  draw(top, 0, 0, 2 * Math.PI, []);
  const middle = document.createElementNS(svgNS, "text");
  middle.setAttribute("class", "sun-center");
  middle.setAttribute("text-anchor", "middle");
  middle.innerHTML = "";
  for (const [dy, text] of [[-6, `${Math.round((100 * top.eaten) / top.total)}%`], [14, "eaten"]]) {
    const line = document.createElementNS(svgNS, "tspan");
    line.setAttribute("x", "0");
    line.setAttribute("y", String(dy));
    line.textContent = text;
    middle.append(line);
  }
  svg.append(middle);
  return svg;
}

async function loadCoverage() {
  const holder = document.getElementById("sunburst");
  try {
    const top = await api("/api/coverage");
    const legend = el("div", { class: "legend" }, el("span", { class: "muted" }, "Share of foods eaten: "),
      Array.from({ length: COVERAGE_STEPS }, (_, i) => el("span", { class: "legend-item" },
        el("span", { class: `swatch step-${i}` }),
        `${Math.round((100 * i) / COVERAGE_STEPS)}–${Math.round((100 * (i + 1)) / COVERAGE_STEPS)}%`)));
    holder.replaceChildren(
      el("p", { class: "muted" }, `Rings from the inside out: ${RING_NAMES.join(", ")}. Only groups you've eaten from are shown. Each slice is sized by `
        + "how many common foods (from the common-foods list, plus anything else you've eaten) it holds, and shaded by "
        + "how many of them you've eaten. Hover for details."),
      legend, renderSunburst(top));
  } catch (error) {
    holder.replaceChildren(banner("error", `Couldn't load coverage: ${error.message}`));
  }
}

  const params = new URLSearchParams(location.hash.split("?")[1] || "");
  if (params.get("taxon")) document.getElementById("gaps-taxon").value = params.get("taxon");
  if (params.get("rank")) document.getElementById("gaps-rank").value = params.get("rank");
  if (params.get("suggest")) document.getElementById("suggest-button").click();
  if (params.get("taxon")) document.getElementById("gaps-form").requestSubmit();
}
